[project]
name = "documind"
version = "0.1.0"
description = "Document questions with cited answers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "slowapi>=0.1.9,<0.2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
